[project]
name = "beavr-network"
version = "0.1.0"
description = "Shared networking library for BEAVR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzmq",
    "numpy",
    "opencv-python",
    "turbojpeg",
]

[project.scripts]
beavr-compile-schemas = "beavr_network.schemas.compiler:compile_schemas"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beavr_network"]
